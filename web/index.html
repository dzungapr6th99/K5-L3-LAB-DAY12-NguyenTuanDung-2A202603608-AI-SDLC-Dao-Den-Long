<html lang="vi">
<head>
<meta charset="utf-8">

<style>
  :root { --amber:#ffb347; --core:#ffe9b0; --gold:#f2c14e; --danger:#ff5a5f; --text:#f5f1e6; --sky:#0e1430; --fog:#1b2350; --red:#c8102e; --ui:1; }
  /* 1rem = 18px at 1280x720: no UI text is smaller. The "chữ lớn" option sets --ui to 1.25. */
  html { font-size: calc(18px * var(--ui, 1)); }
  html, body { margin:0; height:100%; background:var(--sky); overflow:hidden; font-family:"Segoe UI", system-ui, sans-serif; color:var(--text); }
  body { font-size:1rem; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }
  .panel { position:absolute; background:rgba(14,20,48,.82); border:1px solid rgba(242,193,78,.4); border-radius:.7rem; padding:.4rem .8rem; } /* no backdrop-filter: it made every frame expensive */
  #tl { top:12px; left:12px; } #tr { top:12px; right:12px; text-align:right; }
  #tc { top:12px; left:50%; transform:translateX(-50%); text-align:center; min-width:7rem; }
  #clock { font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; }
  #clock.low { color:var(--danger); animation:blink .8s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #nightname { font-size:1rem; opacity:.9; }
  .flames { font-size:1.5rem; letter-spacing:.2rem; color:var(--amber); line-height:1.2; } .flames .off { color:#3a3450; }
  .gold { color:var(--gold); } .big { font-size:1.9rem; }
  #score { font-size:1.5rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; line-height:1.2; }
  body.cb { --danger:#ffffff; }                         /* colour-blind palette: warning colour is white (with a warning sign) */
  body.rm #clock.low, body.rm #count { animation:none; } /* reduce motion: no blinking */
  #bc { bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:.4rem; align-items:center; padding:.4rem .8rem; }
  #cells { display:flex; gap:.25rem; }
  #cells i { width:1rem; height:1rem; border-radius:50%; background:#27305f; border:1px solid rgba(255,229,138,.3); }
  #cells i.on { background:radial-gradient(#fff6c2, #ffe58a 60%, #ffb347); box-shadow:0 0 8px #ffe58a; }
  #br { bottom:14px; right:12px; display:flex; gap:.5rem; align-items:center; }
  .cd { width:5.3rem; height:4.2rem; border-radius:.7rem; border:1px solid rgba(242,193,78,.5); display:flex; align-items:center; justify-content:center; text-align:center; font-size:1rem; line-height:1.15;
        background:conic-gradient(rgba(0,0,0,.65) var(--cd, 0deg), rgba(255,255,255,.07) 0); }
  .cd.dim { opacity:.45; } .cd.charm { border-color:var(--red); box-shadow:0 0 10px var(--red); }
  #charmt { position:absolute; bottom:6.6rem; right:14px; font-size:1rem; color:var(--gold); }
  #alerts { position:absolute; left:12px; bottom:14px; max-width:26rem; display:flex; flex-direction:column; gap:.3rem; }
  #alerts div { background:rgba(14,20,48,.85); border-left:4px solid var(--danger); padding:.2rem .6rem; border-radius:.3rem; font-size:1rem; }
  #prompt { position:absolute; bottom:5.4rem; left:50%; transform:translateX(-50%); font-size:1.1rem; background:rgba(14,20,48,.85); padding:.3rem 1rem; border-radius:1.2rem; border:1px solid var(--amber); opacity:0; transition:opacity .15s; white-space:nowrap; }
  #toast { position:absolute; top:5.2rem; left:50%; transform:translateX(-50%); padding:.3rem .9rem; border-radius:1.2rem; background:rgba(14,20,48,.88); opacity:0; transition:opacity .3s; white-space:nowrap; font-size:1rem; }
  #windwarn { position:absolute; top:8rem; left:50%; transform:translateX(-50%); color:#8fa3b8; font-size:1.1rem; opacity:0; transition:opacity .3s; background:rgba(14,20,48,.7); padding:0 .6rem; border-radius:.4rem; }
  #count { position:absolute; top:22%; left:50%; transform:translateX(-50%); font-size:5rem; font-weight:700; color:var(--danger); opacity:0; text-shadow:0 0 12px #000; animation:blink 1s steps(2) infinite; }
  #hit { position:absolute; inset:0; background:radial-gradient(transparent 40%, rgba(122,60,255,.5)); opacity:0; transition:opacity .4s; }
  body.rm #hit { display:none; }                          /* reduce motion: no full-screen flash */
  #arrow, .sarrow { position:absolute; left:0; top:0; width:0; height:0; border-left:.8rem solid transparent; border-right:.8rem solid transparent; border-bottom:1.7rem solid var(--amber); margin:-.9rem 0 0 -.8rem; opacity:0; filter:drop-shadow(0 0 6px var(--amber)); }
  .sarrow { border-bottom-color:var(--danger); filter:drop-shadow(0 0 6px var(--danger)); }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,10,28,.72); text-align:center; z-index:5; }
  #card { width:min(34rem, 92vw); max-height:90vh; overflow-y:auto; padding:1.4rem 1.8rem; box-sizing:border-box; background:rgba(20,28,64,.96); border:1px solid rgba(242,193,78,.55); border-radius:1rem; }
  #card h1 { margin:0 0 .4rem; color:var(--amber); font-size:1.9rem; }
  #card p { line-height:1.5; margin:.5rem 0; } #card .quote { font-style:italic; color:var(--core); }
  #card label { display:block; margin:.8rem 0; text-align:left; } #card input[type=range] { width:100%; display:block; margin-top:.3rem; }
  #card input#pname { width:100%; box-sizing:border-box; font-size:1rem; padding:.4rem .6rem; border-radius:.5rem; border:1px solid var(--gold); background:#0e1430; color:var(--text); margin-top:.3rem; }
  #card input[type=checkbox] { width:1.2rem; height:1.2rem; flex:none; }
  #card .row { display:flex; gap:.6rem; align-items:center; text-align:left; margin:.7rem 0; }
  #card .row > span { flex:1; } #card .row b { color:var(--gold); }
  #card table { width:100%; border-collapse:collapse; font-size:1rem; font-variant-numeric:tabular-nums; }
  #card th, #card td { padding:.25rem .4rem; text-align:left; border-bottom:1px solid rgba(245,241,230,.15); } #card td:nth-child(3), #card th:nth-child(3) { text-align:right; }
  #card .msg { min-height:1.5rem; color:var(--danger); } #card .ok { color:var(--gold); }
  button { cursor:pointer; font-size:1rem; padding:.55rem 1.4rem; border-radius:1.4rem; border:0; background:var(--amber); color:#2b1600; font-weight:700; margin:.6rem .25rem 0; }
  button.alt { background:transparent; color:var(--text); border:1px solid rgba(245,241,230,.55); }
  button.keybtn { min-width:8rem; margin:0; padding:.3rem .8rem; border-radius:.6rem; }
  button:focus-visible, input:focus-visible { outline:3px solid #ffffff; outline-offset:2px; }
  button:hover { filter:brightness(1.12); }
  kbd { background:#27305f; border-radius:4px; padding:1px 6px; font-size:1rem; }
</style>

<div id="hud">
  <div id="tl" class="panel"><div class="flames" id="flames"></div><div>Đèn sáng: <b id="lit">0/5</b></div></div>
  <div id="tc" class="panel"><div id="clock">4:00</div><div id="nightname"></div></div>
  <div id="tr" class="panel"><div id="score">0</div><div>điểm</div></div>
  <div id="bc" class="panel"><div id="cells"></div><div id="carry" style="margin-left:.4rem;min-width:3.2rem;font-variant-numeric:tabular-nums">0/10</div></div>

  <div id="charmt"></div>
  <div id="alerts"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="windwarn"></div>
  <div id="count"></div>
  <div id="arrow"></div>
  <div id="sarrows"></div>
  <div id="hit"></div>
</div>
